[package]
name = "murex"
version = "0.3.1"
edition = "2021"
description = "Boehm spiral-model conductor: risk register, top-risk selection, and the commitment gate between cycles"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
