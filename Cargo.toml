[package]
name = "murex"
version = "0.5.0"
edition = "2021"
description = "Two build loops for coding agents: a risk-driven spiral and a verification-gated ratchet, both ledger-backed"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
